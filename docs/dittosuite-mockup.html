let currentStep = 0;
let completedUpTo = -1;
let showGuide = false;

const svgCheck = `<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" fill="var(--green)"/><path d="M5 8.2L7 10.2L11 6" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const svgActive = `<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" fill="var(--accent)"/></svg>`;
const svgFuture = `<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="var(--fg-tertiary)" stroke-width="1.2"/></svg>`;
const svgGuide = `<svg viewBox="0 0 16 16" fill="none"><rect x="3" y="2" width="10" height="12" rx="1.5" stroke="currentColor" stroke-width="1.2"/><line x1="5.5" y1="5" x2="10.5" y2="5" stroke="currentColor" stroke-width="1"/><line x1="5.5" y1="7.5" x2="10.5" y2="7.5" stroke="currentColor" stroke-width="1"/><line x1="5.5" y1="10" x2="8.5" y2="10" stroke="currentColor" stroke-width="1"/></svg>`;

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  const guideActive = showGuide ? ' active' : '';
  sb.innerHTML =
    `<div class="sidebar-item${guideActive}" onclick="openGuide()" style="margin-top:8px;">
      <span class="step-icon">${svgGuide}</span>Guide
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-title">Workflow</div>` +
    STEPS.map((s, i) => {
      let cls = 'sidebar-item';
      let icon;
      if (showGuide) { cls += ' completed'; icon = i <= completedUpTo ? svgCheck : svgFuture; }
      else if (i < completedUpTo + 1 && i !== currentStep) { cls += ' completed'; icon = svgCheck; }
      else if (i === currentStep) { cls += ' active'; icon = svgActive; }
      else { cls += ' future'; icon = svgFuture; }
      return `<div class="${cls}" data-step="${i}" onclick="goToStep(${i})">
        <span class="step-icon">${icon}</span>${s.name}
      </div>`;
    }).join('');
}

function openGuide() {
  showGuide = true;
  renderSidebar();
  const d = document.getElementById('detail');
  d.scrollTop = 0;
  d.innerHTML = renderGuide();
}

function goToStep(i) {
  showGuide = false;
  currentStep = i;
  if (i > completedUpTo + 1) completedUpTo = i - 1;
  renderSidebar();
  renderDetail();
}

function completeAndAdvance() {
  if (currentStep > completedUpTo) completedUpTo = currentStep;
  if (currentStep < STEPS.length - 1) {
    currentStep++;
    renderSidebar();
    renderDetail();
  }
}

function goBack() {
  if (currentStep > 0) {
    currentStep--;
    renderSidebar();
    renderDetail();
  }
}

function renderDetail() {
  const d = document.getElementById('detail');
  d.scrollTop = 0;
  switch (currentStep) {
    case 0: d.innerHTML = renderCaseSetup(); break;
    case 1: d.innerHTML = renderBundleSetup(); break;
    case 2: d.innerHTML = renderSourceSelection(); break;
    case 3: d.innerHTML = renderPreflight(); break;
    case 4: d.innerHTML = renderSourceManifest(); break;
    case 5: d.innerHTML = renderCollection(); break;
    case 6: d.innerHTML = renderVerification(); break;
    case 7: d.innerHTML = renderCloseOut(); break;
    case 8: d.innerHTML = renderResults(); break;
  }
}

function renderGuide() {
  return `
    <h1>Guide</h1>
    <p class="subtitle">Forensic principles, data integrity guarantees, and step-by-step instructions for using DittoSuite.</p>
    <hr>

    <div class="guide-section">
      <h2>Core Principle: Data Integrity Above All</h2>
      <div class="principle-card">
        <div class="principle-title">Source Data Must Never Be Modified</div>
        <div class="principle-body">
          Under no circumstances may DittoSuite modify, alter, write to, or change any data on the source device. This is an absolute rule with no exceptions. The tool performs <strong>read-only</strong> operations against source paths at every stage &mdash; manifest building, hashing, and collection.
        </div>
      </div>
      <div class="principle-card">
        <div class="principle-title">Collected Data Must Never Be Modified</div>
        <div class="principle-body">
          Data collected from the source and written into the sparsebundle must not be altered, rewritten, filtered, or transformed in any way. What is copied is an exact, byte-for-byte duplicate of the original. DittoSuite never processes, cleans, converts, or normalizes collected data.
        </div>
      </div>
      <div class="principle-card" style="border-left-color:var(--red);">
        <div class="principle-title">Failure Is Preferred Over Any Data Change</div>
        <div class="principle-body">
          If a file cannot be collected without modifying it &mdash; or if any operation would require writing to the source &mdash; DittoSuite will <strong>fail the operation</strong> and report it as not collected. A failed result with an accurate audit trail is always preferable to a successful result that altered any data whatsoever. There is no override for this behavior.
        </div>
      </div>
    </div>

    <div class="guide-section">
      <h2>Forensic Design Principles</h2>
      <div class="principle-card info">
        <div class="principle-title">Wrap, Don't Hide, Don't Replace</div>
        <div class="principle-body">
          DittoSuite wraps Apple's system binaries (<code>/usr/bin/ditto</code>, <code>/usr/bin/hdiutil</code>) via subprocess calls with argument arrays. It never uses shell invocation, never hides upstream output, and never substitutes its own implementation for what the system tool does. Every invocation is fully recorded.
        </div>
      </div>
      <div class="principle-card info">
        <div class="principle-title">Independent Verification</div>
        <div class="principle-body">
          After collection, DittoSuite builds its own manifest of the destination and compares it against the source manifest. Verification is independent of <code>ditto</code>'s exit code or output &mdash; DittoSuite does not trust upstream tools to self-report accuracy. Any mismatch is a hard FAIL.
        </div>
      </div>
      <div class="principle-card info">
        <div class="principle-title">Tamper-Evident Audit Log</div>
        <div class="principle-body">
          Every operation is recorded in a hash-chained, append-only JSON Lines log stored inside the sparsebundle. Each entry contains the SHA-256 hash of the previous entry, forming a chain that reveals any tampering. The log uses POSIX <code>O_APPEND</code> semantics for write atomicity.
        </div>
      </div>
      <div class="principle-card info">
        <div class="principle-title">No Silent Failures</div>
        <div class="principle-body">
          Every error, denial, skip, or anomaly is logged with the path and reason. Nothing is silently swallowed. If a file cannot be read, it appears in the &ldquo;What Was Not Collected&rdquo; section of the report with an explanation.
        </div>
      </div>
      <div class="principle-card info">
        <div class="principle-title">No Network Access</div>
        <div class="principle-body">
          DittoSuite makes zero network calls. There are no telemetry hooks, update checks, analytics, or remote logging. Environment variables are scrubbed before subprocess invocation. The tool operates entirely offline.
        </div>
      </div>
    </div>

    <div class="guide-section">
      <h2>What DittoSuite Is (and Is Not)</h2>
      <div class="principle-card green">
        <div class="principle-title">This is a targeted logical collection tool.</div>
        <div class="principle-body">
          DittoSuite collects only the files and folders the examiner selects. It does not image a full disk. It does not capture unallocated space, deleted files, or system-level artifacts beyond what is selected. Every report states this clearly.
        </div>
      </div>
      <p>DittoSuite is <strong>not</strong>:</p>
      <ul>
        <li>A full-disk or physical imaging tool</li>
        <li>A decryption or credential extraction tool</li>
        <li>A network, cloud, or remote collection tool</li>
        <li>An AI-powered analysis or triage tool</li>
      </ul>
    </div>

    <div class="guide-section">
      <h2>Workflow Steps</h2>
      <h3>1. Case Setup</h3>
      <p>Enter examiner name (required), custodian name (required), and case/evidence identifiers. Device details (make, model, serial, macOS version, collection location) and legal authority fields are optional &mdash; fill them in at your discretion.</p>

      <h3>2. Bundle Setup</h3>
      <p>Create a new APFS sparsebundle to hold the collected evidence. Choose a location, filesystem type, maximum size, and optional AES-256 encryption. The sparsebundle is created using <code>hdiutil</code> with the full invocation recorded.</p>

      <h3>3. Source Selection</h3>
      <p>Use the file and folder pickers to select what to collect. The selection list shows per-item size and file count estimates. Overlapping selections (a parent and its child) are detected and flagged. Only what you select is collected.</p>

      <h3>4. Pre-flight Checks</h3>
      <p>Automated checks verify: macOS version is on the validated list, Full Disk Access is granted, selected sources are readable, free space is sufficient, the bundle is mounted and writable, and system binary hashes match known-good values. Blocking failures prevent proceeding.</p>

      <h3>5. Source Manifest</h3>
      <p>A read-only walk of every selected source, recording each file's relative path, type, size, SHA-256 hash, timestamps, permissions, extended attributes, symlink targets, and hard-link relationships. This is the ground truth that verification compares against.</p>

      <h3>6. Collection</h3>
      <p>Files are copied to the mounted sparsebundle using <code>ditto</code>, one source at a time. Each invocation is recorded with arguments, exit code, duration, and hashed stdout/stderr. Cancellation is available and produces a labeled partial result.</p>

      <h3>7. Verification</h3>
      <p>An independent manifest of the destination is built and compared field-by-field against the source manifest. File count, total size, and per-file SHA-256 must all match. Any mismatch is a hard FAIL. Metadata differences (timestamps, extended attributes) are reported separately. Source files that changed during collection are flagged.</p>

      <h3>8. Close-out</h3>
      <p>Band count is checked against the threshold (100,000 limit). The sparsebundle is cleanly detached. Final audit log entries are recorded, including overall status and any audit log failures.</p>

      <h3>9. Results &amp; Report</h3>
      <p>The results screen shows what was collected, what was not collected (with reasons), and per-file errors. Export a text report, JSON report, or the raw audit log. Every report states that this is a targeted logical collection and includes the full audit trail reference.</p>
    </div>

    <div class="guide-section">
      <h2>Known Limitations</h2>
      <ol>
        <li><code>ditto</code> does not preserve directory hard links</li>
        <li>Extended attribute preservation may be incomplete for system-protected xattrs</li>
        <li>Source file access times may change during collection (reading for hashing)</li>
        <li><code>hdiutil verify</code> does not reliably cover writable sparsebundles</li>
        <li>Unicode filename normalization (NFC/NFD) must be empirically validated</li>
        <li><code>hdiutil</code> is deprecated in macOS 27 (Golden Gate); still functional</li>
      </ol>
      <p>Every report includes the complete list of known limitations.</p>
    </div>

    <div class="guide-section">
      <h2>Compliance</h2>
      <p>DittoSuite's 32-item compliance matrix maps requirements to ISO 27037, NIST SP 800-86, SWGDE best practices, and FRE 901. The tool has passed automated code review but has <strong>not been compiled, executed, or validated on macOS</strong>. Independent human validation is required before use on real evidence.</p>
    </div>`;
}

let isDark = false;
try { isDark = localStorage.getItem('ds-theme') === 'dark'; } catch(e) {}
if (isDark) applyTheme('dark');

function toggleTheme() {
  isDark = !isDark;
  applyTheme(isDark ? 'dark' : 'light');
  try { localStorage.setItem('ds-theme', isDark ? 'dark' : 'light'); } catch(e) {}
}
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const icon = document.getElementById('themeIcon');
  const label = document.getElementById('themeLabel');
  if (t === 'dark') {
    icon.innerHTML = '&#9788;';
    label.textContent = 'Light';
  } else {
    icon.innerHTML = '&#9790;';
    label.textContent = 'Dark';
  }
}
