<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SherlockMail 2.0 - Forensic Email Collector</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>SherlockMail</h1>
        <span class="badge" style="background:var(--success)">v2.0</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Overview</div>
          <div class="nav-item active" data-page="dashboard">
            <span class="icon">&#9632;</span> Dashboard
          </div>
          <div class="nav-item" data-page="protocols">
            <span class="icon">&#9672;</span> Protocols
          </div>
          <div class="nav-item" data-page="formats">
            <span class="icon">&#9998;</span> Export Formats
          </div>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Collection</div>
          <div class="nav-item" data-page="projects">
            <span class="icon">&#9733;</span> Projects
          </div>
          <div class="nav-item" data-page="connect">
            <span class="icon">&#9889;</span> Connect & Collect
          </div>
          <div class="nav-item" data-page="search">
            <span class="icon">&#8981;</span> Query Builder
          </div>
          <div class="nav-item" data-page="inline">
            <span class="icon">&#128270;</span> Inline Search
          </div>
          <div class="nav-item" data-page="export">
            <span class="icon">&#8681;</span> Export
          </div>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Forensics</div>
          <div class="nav-item" data-page="qc">
            <span class="icon">&#9745;</span> Quality Control
          </div>
          <div class="nav-item" data-page="cloud">
            <span class="icon">&#9729;</span> Cloud Attachments
          </div>
          <div class="nav-item" data-page="timestamps">
            <span class="icon">&#9201;</span> Timestamps
          </div>
          <div class="nav-item" data-page="audit">
            <span class="icon">&#9881;</span> Audit Log
          </div>
          <div class="nav-item" data-page="integrity">
            <span class="icon">&#10003;</span> Evidence Integrity
          </div>
        </div>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="main">
      <header class="main-header">
        <h2 id="page-title">Dashboard</h2>
        <div style="display:flex;gap:8px;align-items:center">
          <span style="font-size:12px;color:var(--text-muted)">FEC-Grade Forensic Collection</span>
        </div>
      </header>
      <div class="main-content" id="content"></div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-content"></div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="/js/app.js"></script>
</body>
</html>
